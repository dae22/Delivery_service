services:
  db:
    image: postgres:17.6
    container_name: delivery_db
    environment:
      POSTGRES_PASSWORD: 1998
      POSTGRES_DB: delivery_db
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:/var/lib/postgres/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d delivery_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:8.2.1
    container_name: delivery_redis
    restart: unless-stopped
    volumes:
      - rdata:/data
    ports:
      - "6379:6379"
  app:
    build: .
    container_name: delivery_app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
    driver: local
  rdata:
    driver: local
