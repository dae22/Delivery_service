services:
  db:
    image: postgres:17.6
    container_name: delivery_db
    environment:
      POSTGRES_PASSWORD:
      POSTGRES_DB: delivery_db
    ports:
      - "5430:5430"
    volumes:
      - ./pgdata:/var/lib/postgres/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d delivery_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  pgdata:
    driver: local
