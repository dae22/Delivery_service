services:
  db:
    image: postgres:17.6
    container_name: test_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: 1998
      POSTGRES_DB: delivery_test
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      retries: 10
    volumes:
      - db_test_data:/var/lib/postgresql/data

volumes:
  db_test_data:
